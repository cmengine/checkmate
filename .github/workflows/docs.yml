# Deploys the documentation (docs/, an mdBook) to GitHub Pages.
#
# The docs live in the same repository as the implementation and deploy
# from the default branch: a push that touches docs/ or this workflow
# rebuilds and republishes the site. Runs can also be triggered manually
# from the Actions tab (workflow_dispatch).

name: docs

on:
  push:
    branches: [mom]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow at most one concurrent Pages deployment; do not cancel in-progress
# runs so a deploy always completes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mdbook --version

      - name: Build the book
        run: mdbook build docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
