[workspace]
members = ["crates/*", "apps/rust_host"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Matin Mohammadi"]
license = "Apache-2.0"
description = "Checkmate Engine: A statically typed, embeddable scripting language"
readme = "README.md"
repository = "https://github.com/cmengine/checkmate"
keywords = ["checkmate", "scripting", "embedding", "language"]
categories = ["compilers", "parser-implementations"]

[package]
name = "cme"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
cme-core = { path = "crates/cme-core", version = "0.3.0", optional = true }
cme-compiler = { path = "crates/cme-compiler", version = "0.3.0", optional = true }
cme-interp = { path = "crates/cme-interp", version = "0.3.0", optional = true }
cme-runtime = { path = "crates/cme-runtime", version = "0.3.0", optional = true }
cme-api = { path = "crates/cme-api", version = "0.3.0", optional = true }
cme-schema-macro = { path = "crates/cme-schema-macro", version = "0.3.0", optional = true }
cme-lsp = { path = "crates/cme-lsp", version = "0.3.0", optional = true }

# The root integration tests drive the real front end and interpreter.
[dev-dependencies]
cme-core = { path = "crates/cme-core", version = "0.3.0" }
cme-compiler = { path = "crates/cme-compiler", version = "0.3.0" }
cme-interp = { path = "crates/cme-interp", version = "0.3.0" }

[features]
default = []
core = ["dep:cme-core"]
compiler = ["dep:cme-compiler"]
interp = ["dep:cme-interp"]
runtime = ["dep:cme-runtime"]
# The Rust host embedding API (WHITEPAPER §13.1): Engine, CompiledProgram,
# Context, ExecutionLimits.
api = ["dep:cme-api"]
# The language server (WHITEPAPER §12, §14): the salsa-backed `cme lsp`
# pipeline served over stdio by the same binary.
lsp = ["dep:cme-lsp"]
# The CLI toolchain requires these crates to function. The language server
# is part of the developer binary (`cme lsp`), so `cli` pulls it in; the
# default build stays dependency-free.
cli = ["core", "compiler", "interp", "runtime", "lsp"]
# Compile-time-verified host bindings from .cm schema files (§9.6); pulls
# in `api` because the generated code references the host API surface.
schema-macro = ["api", "dep:cme-schema-macro"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"all\"))"] }
