[package]
name = "cme-rust-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust host application for Checkmate: loads programs, invokes entry points under §5.5 limits"
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cme-rust-host"
path = "src/main.rs"

# Consumes the API through the `cme` facade exactly as the WHITEPAPER §13.1
# example does: `use cme::{Engine, ExecutionLimits, ...}`. The `schema-macro`
# feature pulls the §9.6 proc macro, so `cme_schema_bindings!` runs at THIS
# crate's compile time over schemas/game.cm — the generated code references
# the facade's `api` re-export (`crate = ::cme::api`).
[dependencies]
cme = { path = "../..", features = ["api", "schema-macro"] }
