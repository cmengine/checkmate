[package]
name = "cme-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish = true

[dependencies]
cme-core = { path = "../cme-core", version = "0.2.0" }
cme-compiler = { path = "../cme-compiler", version = "0.2.0" }
cme-interp = { path = "../cme-interp", version = "0.2.0" }

# The facade test compiles the root `cme` package with its `api` feature to
# pin the WHITEPAPER §13.1 import shape (`use cme::{Engine, ExecutionLimits}`)
# from a consumer's point of view.
[dev-dependencies]
cme = { path = "../..", features = ["api"] }
