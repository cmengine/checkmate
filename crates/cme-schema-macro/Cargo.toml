[package]
name = "cme-schema-macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Compile-time-verified Checkmate host bindings from .cm schema files (WHITEPAPER 9.6)"
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
proc-macro = true

[dependencies]
cme-compiler = { path = "../cme-compiler", version = "0.4.0" }
cme-core = { path = "../cme-core", version = "0.4.0" }

# Test-only: the generated bindings reference the host API, so the
# integration tests compile and run them end to end. These tests use the
# explicit `crate = ::cme_api` path on purpose: dev-depending on the `cme`
# facade here would create a dependency cycle (facade → this proc macro),
# and cyclic workspace deps cannot be published to crates.io in version
# order. The default `::cme::api` path is pinned instead by the root
# `tests/facade_setup.rs` (feature `schema-macro`), which depends
# facade-ward like every other consumer.
[dev-dependencies]
cme-api = { path = "../cme-api", version = "0.4.0" }
