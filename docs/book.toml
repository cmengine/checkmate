[book]
title = "Checkmate"
authors = ["The Checkmate Authors"]
description = "The Checkmate language, toolchain, and host embedding documentation"
src = "src"
language = "en"
multilingual = false
text-size-limit = 262144

[build]
build-dir = "book"
create-missing = false

[preprocessor.index]

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
curly-quotes = true
mathjax-support = false
git-repository-url = "https://github.com/cmengine/checkmate"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/cmengine/checkmate/edit/mom/docs/{path}"
site-url = "/checkmate/"
cname = ""
additional-js = ["src/theme/checkmate-highlight.js"]
additional-css = ["src/theme/checkmate.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.playground]
editable = false
copy-js = true
