name = "Checkmate"
grammar = "checkmate"
path_suffixes = ["cm"]
line_comments = ["// "]
tab_size = 4
hard_tabs = false

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]

# Newline-significant statement boundaries: a line ending in `{` or `(` keeps
# the next line indented even when indents.scm cannot see a complete block.
increase_indent_pattern = "\\{[^}\"\n]*$|\\([^)\n]*$|=>\\s*$"
decrease_indent_pattern = "^\\s*\\}|^\\s*\\)|^\\s*\\]"
